<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Basketball Stats Result</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
  </head>
  <body class="container py-5">
    <h1 class="mb-4">Field Goal Percentage</h1>

    <div class="card">
      <div class="card-body">
        <p class="card-text">{{ name }} attempted {{ fga }} shots and made {{ fgm }} of them.</p>
        <p class="card-text">Field Goal Percentage: {{ fgp|floatformat:2 }}%.</p>
      </div>
    </div>

    <p class="mt-4"><a href="{% url 'plusminus:index' %}">Calculate another player</a></p>
  </body>
</html>
